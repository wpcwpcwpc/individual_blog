# nginx 配置模板 — qa-agent-ui web 部署网关
#
# 职责：
#   1. 托管 qa-agent-ui/dist 静态资源（index.html + /assets/*），加缓存 header
#   2. 反代所有非静态请求到 qa-agent:8000（API 路径 + 前端路由 SPA fallback）
#   3. WebSocket Upgrade 透传（真实路径 /sessions/{sid}/stream/ws）
#
# nginx 同域托管静态 + 反代动态，qa-agent 的 web/ 目录做 SPA 404 fallback。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # gzip 压缩（静态文本资源）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # 上传大小限制（skill zip 包可能较大，默认 1M 会 413）
    # 覆盖 /api/skills/upload 等文件上传接口
    client_max_body_size 50m;

    # qa-agent 上游（docker-compose service name）
    upstream qa_agent {
        server qa-agent:8000;
    }

    server {
        listen 80;
        server_name _;

        # 静态资源根目录（docker volume 挂载 qa-agent-ui/dist）
        root /usr/share/nginx/html;
        index index.html;

        # ── index.html 不缓存（SPA 入口每次拿最新） ───────────────
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # ── /assets/* 强缓存（哈希文件名，immutable） ─────────────
        location /assets/ {
            add_header Cache-Control "max-age=31536000, immutable" always;
        }

        # ── WebSocket Upgrade 透传（真实路径，含 /api 前缀） ────────
        # qa-agent WS 挂在 api_router (prefix=/api), 实际路径:
        #   /api/sessions/{sid}/stream/ws  (server.py:1581)
        #   /api/workflows/ws              (workflow_os_adapter.py:672)
        # 前端 getWSStreamUrl (sessions.ts:33) 生成 ws://host/api/sessions/.../stream/ws
        location ~ ^/api/(sessions/.+/stream/ws|workflows/ws)$ {
            proxy_pass http://qa_agent;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            # WS 长连接超时（默认 60s 会断，Agno 事件流需保活）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── SSE 流式响应禁缓冲（确保 text/event-stream 实时透传） ───
        # qa-agent 多个端点用 StreamingResponse + text/event-stream:
        #   /api/sessions/{sid}/messages (agent_os_adapter.py:244, 会话流式)
        #   /api/eval/...                (eval_routes.py:161)
        #   /api/version-dataset/...     (version_dataset_routes.py:98)
        #   /api/workflows/...           (workflow_os_adapter.py:282)
        # nginx 默认 proxy_buffering on 会攒满 buffer 才发, 前端表现为"一直无响应".
        location ~ ^/api/.*$ {
            proxy_pass http://qa_agent;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            # 禁缓冲: SSE/流式响应必须实时透传
            proxy_buffering off;
            proxy_cache off;
            # 长响应超时 (agent run 可能数分钟)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ── 其余非静态请求全反代到 qa-agent ───────────────────────
        # API 路径（/sessions /auth /system 等）→ qa-agent 返回 JSON
        # 前端路由（/generate-case /sessions 页面）→ qa-agent 404 fallback 返回 web/index.html
        location / {
            proxy_pass http://qa_agent;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }
    }
}
