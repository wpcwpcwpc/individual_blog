# docker-compose 编排 — qa-agent-ui web 部署
#
# 架构：nginx 托管静态资源 + 反代动态到 qa-agent；qa-agent web/ 挂载 dist 做 SPA fallback。
#
# 前置：
#   1. 先在 qa-agent-ui 跑 `npm run build:web` 产出 dist/
#   2. qa-agent 的 .env 配置好（MongoDB URI / LLM / RAG 等），放 qa-agent/.env
#   3. MongoDB 假设外部已就绪（或在此 compose 加 mongodb service）
#
# 启动：docker-compose -f qa-agent-ui/deploy/docker-compose.yml up -d
# 访问：http://<host>:8080

services:
  # ── qa-agent 后端 ──────────────────────────────────────────
  # FastAPI :8000，处理 API + WS + SPA 404 fallback（web/ 挂载 dist）
  qa-agent:
    build:
      context: ../../qa-agent
      dockerfile: Dockerfile
    # 不暴露端口到宿主机，仅容器内网络可达（nginx 反代）
    expose:
      - "8000"
    volumes:
      # 挂载 qa-agent-ui 构建产物到 /app/web，启用 SPA 404 fallback
      # _WEB_DIR = Path(server.py).parent.parent / "web" = /app/web
      - ../../qa-agent-ui/dist:/app/web:ro
    env_file:
      - ../../qa-agent/.env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - LOG_LEVEL=info
    healthcheck:
      # /health 端点见 api/server.py:1564
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ── nginx 网关 ────────────────────────────────────────────
  # 托管 dist 静态资源 + 反代动态到 qa-agent + WS Upgrade 透传
  nginx:
    image: nginx:alpine
    ports:
      # 暴露 8080 到宿主机（按需改）
      - "8080:80"
    volumes:
      # 静态资源（index.html + assets）
      - ../../qa-agent-ui/dist:/usr/share/nginx/html:ro
      # nginx 配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      qa-agent:
        condition: service_healthy
    restart: unless-stopped
