[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.1.0"
description = "AI-powered QA Agent system built on the Agno framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "The QA Agent Authors"}
]

dependencies = [
    "agno==2.6.22",  # >=2.5.17 均含 streamable-http header_provider 修复（Bearer-protected MCP 401）
    "openai>=1.30.0",
    "pymilvus>=2.4.0",
    "fastapi>=0.115.0",
    # Starlette's SessionMiddleware (api/server.py) signs the login cookie with
    # itsdangerous, and starlette does not pull it in on its own.
    "itsdangerous>=2.1",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-frontmatter>=1.1.0",
    "tiktoken>=0.7.0",
    # Required by Agno's "os" and "sqlite" extras, which this repo uses:
    # `agno.os.utils.format_sse_event` (api/agent_os_adapter.py) and
    # `agno.db.sqlite.SqliteDb` (core/storage.py storage_backend="sqlite").
    "sqlalchemy>=2.0.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    # MongoDB: Agno's MongoDb adapter + Beanie require the sync/async pair
    # below. motor 3.x is the asyncio driver; beanie pins its own motor range.
    # Upper bound on beanie is load-bearing: beanie 2.x calls
    # `client.append_metadata(...)`, which AsyncIOMotorClient does not have, so
    # db/mongo.py::init_db fails with "MotorDatabase object is not callable"
    # and — because that call site swallows exceptions — silently degrades to
    # "MongoDB unavailable" instead of failing loudly.
    "motor>=3.5",
    "beanie>=1.30.0,<2.0.0",
    "pymongo>=4.6",
    # Tracing (OpenTelemetry)
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "openinference-instrumentation-agno>=0.1.30",
    "httpx>=0.27.0",
    # MCP (Model Context Protocol) — agno MCPTools stdio path hard-dep
    # (mcp_service/loader.py:150 `from mcp import StdioServerParameters`).
    # Frozen builds: collected via qa_agent.spec. Linux venv: must install.
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]
xlsx = [
    # Optional: tools/file_tools.py parses .xlsx via openpyxl and degrades to a
    # clear error string when it is absent.
    "openpyxl>=3.1",
]
sqlite = [
    # Required by agno.db.sqlite.SqliteDb, selectable via
    # STORAGE_BACKEND=sqlite (core/storage.py) and used as the last-resort
    # fallback when MongoDB / PostgreSQL drivers are missing.
    "aiosqlite>=0.20",
]
postgres = [
    # Agno's own "postgres" extra installs psycopg 3 (`psycopg` +
    # `psycopg-binary`), and core/storage.py imports agno.db.postgres.PostgresDb
    # — so psycopg 2 would not be read.
    "psycopg[binary]>=3.1",
]

# This repository is an application, not an installable library. Modules are
# imported from the project root (`python main.py` / `python -m uvicorn
# main:app`), so no top-level package is declared: `pip install .` installs the
# dependencies but no code, and running the app is always done from the project
# root.
#
# `packages = []` is required, not cosmetic: with ten top-level directories
# (api/, core/, tools/, …) setuptools' flat-layout auto-discovery aborts with
# "Multiple top-level packages discovered in a flat-layout". An empty list keeps
# `pip install -e .` (used by deploy.sh, for the dependency ranges) working,
# without pushing generic top-level names like `core` or `api` into
# site-packages.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
